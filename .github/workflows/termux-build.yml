name: Build frida-ui for Termux (ARM64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-termux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y python3 python3-pip python3-venv \
          build-essential clang cmake git curl rustc cargo

    - name: Install maturin
      run: pip install maturin

    - name: Add ARM64 target for Rust
      run: rustup target add aarch64-unknown-linux-gnu

    - name: Build wheel for ARM64
      env:
        CC: clang
        CXX: clang++
      run: |
        maturin build --release --target aarch64-unknown-linux-gnu \
          --compatibility manylinux2014

    - name: Upload wheel
      uses: actions/upload-artifact@v4
      with:
        name: frida-ui-termux
        path: target/aarch64-unknown-linux-gnu/release/wheels/*.whl
